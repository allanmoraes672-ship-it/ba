<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="titulo-pagina">NovaBank - Criar conta</title>

    <link rel="stylesheet" href="dois.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <a href="index.html" class="logo">
        </a>

        <nav class="menu">
            <a href="index.html"></a>
            <a href="index.html#conta"></a>
            <a href="index.html#cartao"></a>
            <a href="index.html#pix"></a>
            <a href="index.html#beneficios"></a>
        </nav>

        <div class="botoes">
            <a href="login.html" class="entrar">Entrar</a>
        </div>

    </header>


    <!-- CADASTRO -->
    <main class="pagina-formulario">

        <div class="formulario">

            <div class="titulo-formulario">

                <p>NOVABANK</p>

                <h1>Crie sua conta</h1>

                <span>
                    Preencha seus dados para começar.
                </span>

            </div>


            <form>

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <div class="termos">

                    <input
                        type="checkbox"
                        id="termos"
                        required
                    >

                    <label for="termos">
                        Li e aceito os termos de uso.
                    </label>

                </div>


                <button type="submit" class="botao-formulario">
                    Criar minha conta
                </button>

            </form>


            <p class="trocar-pagina">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </p>

        </div>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <div class="logo">
            Nova<span>Bank</span>
        </div>

        <p>
            © 2026 NovaBank. Projeto fictício para estudos.
        </p>

        <div class="links-footer">

            <a href="#">Privacidade</a>

            <a href="#">Termos</a>

            <a href="#">Contato</a>

        </div>

    </footer>

</body>

</html>
