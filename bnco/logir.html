<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaBank - Entrar</title>

    <link rel="stylesheet" href="dois.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

      

        <div class="botoes">

            <a href="cadastro.html" class="cadastrar">
            </a>

        </div>

    </header>


    <!-- LOGIN -->
    <main class="pagina-formulario">

        <div class="formulario">

            <div class="titulo-formulario">

                <p>NOVABANK</p>

                <h1>Bem-vindo de volta</h1>

                <span>
                    Entre na sua conta para continuar.
                </span>

            </div>


            <form>

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <div class="lembrar">

                    <label>

                        <input
                            type="checkbox"
                            id="lembrar"
                        >

                        Lembrar de mim

                    </label>


                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>


                <button type="submit" class="botao-formulario">
                    Entrar
                </button>

            </form>


            <p class="trocar-pagina">

                Ainda não possui uma conta?

                <a href="cadastro.html">
                    Criar conta
                </a>

            </p>

        </div>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <div class="logo">
            Nova<span>Bank</span>
        </div>

        <p>
            © 2026 NovaBank. Projeto fictício para estudos.
        </p>

        <div class="links-footer">

            <a href="#">Privacidade</a>

            <a href="#">Termos</a>

            <a href="#">Contato</a>

        </div>

    </footer>

</body>

</html>
